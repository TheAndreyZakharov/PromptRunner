[package]
name = "PromptRunner"
version = "0.1.0"
description = "Coordinate-based black-box prompt test runner"
authors = ["PromptRunner"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "promptrunner_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
arboard = "3.6"
base64 = "0.22"
dirs = "6"
enigo = "0.6"
image = "0.24"
regex = "1"
rfd = "0.15"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
